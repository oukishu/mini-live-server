name: Mini Live Server

on:
  workflow_dispatch:

env:
  TZ: Asia/Shanghai
  TimeZone: China Standard Time
  TARGET: /workdir

jobs:
  build_windows_client:
    name: windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          check-latest: true

      - name: Initialization environment
        run: |
          mkdir target
          $env:FILE_DATE=$(Get-Date -format "_yyyyMMddHHmm")

      - name: Download 7-Zip
        run: |
          Invoke-WebRequest https://www.7-zip.org/a/7z2409-x64.exe -OutFile 7zip.exe
          Start-Process -Wait -FilePath .\7zip.exe -ArgumentList "/S /D=$env:ProgramFiles\7-Zip\"

      - name: Build Mini Live Server
        run: |
          go mod init mini-live-server
          go mod tidy
          $env:CGO_ENABLED=0
          $env:GOOS="windows"
          $env:GOARCH="amd64"
          go build -o "$env:GITHUB_WORKSPACE\target\mini-live-server.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@master
        with:
          name: mini-live-server${{ env.FILE_DATE }}
          path: target